<!doctype html>
<html lang="en">
<head>
<script>
  // Money Out safety rule: NEVER clear or reset existing localStorage data.
  // App updates must preserve all saved pay periods, expenses, and bills.
  const MONEY_OUT_NON_DESTRUCTIVE = true;
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#171717;--muted:#73777d;--line:#d9d9df;--green:#d8ef9c;--yellow:#fff19b;--pink:#efb6b6;--blue:#a9c9ed;--orange:#efbd7e;--accent:#16834b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
header{background:#1c1c1e;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 13px;position:sticky;top:0;z-index:20}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:800}.subtitle{font-size:12px;color:#b7b7bc;margin-top:3px}.head button{border:0;background:#303033;color:#fff;border-radius:12px;padding:9px 11px;font-size:17px}
main{max-width:900px;margin:auto;padding:12px 12px 100px}.periodnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}.periodnav button{width:40px;height:38px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:20px}.perioddelete{width:40px;height:38px;border:1px solid #efcaca;background:#fff5f5;color:#b42318;border-radius:12px;font-size:17px}.periodname{flex:1;text-align:center;font-weight:800}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}.card span{font-size:11px;color:var(--muted)}.card b{display:block;font-size:19px;margin-top:3px}
.panel{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-bottom:12px}.income-row{display:flex;align-items:center;padding:11px 13px;border-top:1px solid var(--line)}.income-info{flex:1}.incomename{font-weight:700}.incomeamount{font-weight:750;margin-right:8px}.panelhead{padding:13px;display:flex;justify-content:space-between;align-items:center}.panelhead h2{font-size:17px;margin:0}.add{border:0;background:var(--accent);color:#fff;font-weight:800;border-radius:10px;padding:8px 11px}
.cols{display:grid;grid-template-columns:minmax(145px,1fr) 82px 82px 70px}.headrow{background:#f7f7f8;color:#777;font-size:10px;font-weight:800;text-transform:uppercase}.cell{padding:7px 7px;min-height:43px;border-top:1px solid var(--line);display:flex;align-items:center}.name{font-weight:700}.money{width:100%;padding:7px 4px;border:1px solid #d5d5da;border-radius:8px;font-size:13px;text-align:right;background:#fff}.diff{justify-content:flex-end;text-align:right;font-size:12px;font-weight:800}.good{color:#25802c}.bad{color:#c42e2e}.neutral{color:var(--ink)}
.section .cell{grid-column:1/-1;font-weight:800}.gray .cell{background:#d9d9d9}.yellow .cell{background:#fff19b}.pink .cell{background:#efb6b6}.blue .cell{background:#a9c9ed}.total .cell{background:#efbd7e;font-weight:850}
.bill{display:flex;align-items:center;padding:11px 13px;border-top:1px solid var(--line)}.billinfo{flex:1}.billname{font-weight:700}.billdue{font-size:11px;color:var(--muted)}.billamount{font-weight:750;margin-right:8px}.tiny{border:0;background:#eeeef0;border-radius:8px;padding:7px 9px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:30}.bottomin{max-width:900px;margin:auto;display:flex;gap:8px}.bottom button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:800}.greenbtn{background:var(--accent);color:#fff}.lightbtn{background:#ececf0}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:50;align-items:flex-end}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 13px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:16px}.deletebtn{width:100%;margin-top:10px;border:0;background:#ffe5e5;color:#b42318;border-radius:12px;padding:14px;font-weight:800;font-size:16px}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1;border:0;border-radius:11px;padding:12px;font-weight:800}.cancel{background:#ececf0}.savebtn{background:var(--accent);color:#fff}
@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}}@media(max-width:360px){.cols{grid-template-columns:minmax(125px,1fr) 70px 70px 62px}.money{font-size:12px}}
</style>

<script>
(function(){
  // Variable-income support. Existing saved data is preserved.
  function moneyOutEnsureIncome(period) {
    if (!period) return;
    if (!Array.isArray(period.incomeItems)) {
      const old = Number(period.income || 0);
      period.incomeItems = old ? [{id:"income-"+Date.now(), name:"Income", planned:old, actual:old}] : [];
    }
  }
  window.moneyOutEnsureIncome = moneyOutEnsureIncome;
})();
</script>

</head>
<body>
<header><div class="head"><div><div class="brand">Money Out</div><div class="subtitle" id="subtitle"></div></div><button onclick="incomeEdit()">💰</button></div></header>
<main>
<div class="periodnav"><button onclick="move(-1)">‹</button><div class="periodname" id="periodname"></div><button onclick="move(1)">›</button><button class="perioddelete" onclick="deletePeriod()" aria-label="Delete pay period">🗑️</button></div>
<div class="cards"><div class="card"><span>Income</span><b id="income"></b></div><div class="card"><span>Planned</span><b id="planned"></b></div><div class="card"><span>Actual</span><b id="actual"></b></div><div class="card"><span>Remaining</span><b id="remaining"></b></div></div>
<section class="panel"><div class="panelhead"><h2>Income</h2><button class="add" onclick="addIncome()">＋ Income</button></div><div id="incomerows"></div></section>
<section class="panel"><div class="panelhead"><h2>Budget</h2><button class="add" onclick="addExpense()">＋ Expense</button></div>
<div class="cols headrow"><div class="cell">Expense</div><div class="cell">Planned</div><div class="cell">Actual</div><div class="cell">Diff.</div></div>
<div id="rows"></div></section>
<section class="panel"><div class="panelhead"><h2>Recurring Bills</h2><button class="add" onclick="addBill()">＋ Bill</button></div><div id="billrows"></div></section>
</main>
<div class="bottom"><div class="bottomin"><button class="lightbtn" onclick="newPeriod()">New Pay Period</button><button class="greenbtn" onclick="addExpense()">＋ Add Expense</button></div></div>
<div class="modal" id="modal"><div class="sheet"><h3 id="mtitle"></h3><div id="form"></div><div class="actions"><button class="cancel" onclick="closeModal()">Cancel</button><button class="savebtn" onclick="saveModal()">Save</button></div></div></div>
<script>
const PUBLIC_SAFE_START = true;

const KEY="MoneyOutPWA.v3";
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{
  periods:[{label:"Current Pay Period",income:0,incomeItems:[],items:[]}],
  bills:[]
};
// Non-destructive migration: convert any legacy single income amount into one income line.
data.periods.forEach(p=>{
  if(!Array.isArray(p.incomeItems)){
    const old=Number(p.income||0);
    p.incomeItems=old ? [{id:"legacy-"+Math.random().toString(36).slice(2),name:"Income",amount:old}] : [];
  }
});
let pi=0,modalMode="",edit=-1;
const $=x=>document.getElementById(x);
const money=n=>"$"+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

// Expense templates that automatically carry into every NEW pay period.
// Actual spending always resets to blank/0 for the new period.
function templateItemsFrom(period){
  return period.items
    .filter(x=>x[3]!=="bills" && x[3]!=="unexpected")
    .map(x=>[x[0], Number(x[1]||0), "", x[3]]);
}

function parsePeriod(label){
  const m=String(label).match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*[–-]\s*(\d{1,2})\s*\/\s*(\d{1,2})/);
  if(!m) return null;
  let sm=+m[1], sd=+m[2], em=+m[3], ed=+m[4];
  let sy=2026, ey=2026;
  if(em<sm || (em===sm && ed<sd)) ey=sy+1;
  return {start:new Date(sy,sm-1,sd), end:new Date(ey,em-1,ed)};
}

function billDatesForPeriod(label){
  const r=parsePeriod(label);
  if(!r) return [];
  const out=[];
  let cur=new Date(r.start.getFullYear(),r.start.getMonth(),1);
  const endMonth=new Date(r.end.getFullYear(),r.end.getMonth(),1);
  while(cur<=endMonth){
    for(let day=1;day<=31;day++){
      const d=new Date(cur.getFullYear(),cur.getMonth(),day);
      if(d.getMonth()!==cur.getMonth()) break;
      if(d>=r.start && d<=r.end) out.push({date:d,day});
    }
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  return out;
}

function ensureBillsForPeriod(period){
  if(!period || !Array.isArray(period.items) || !Array.isArray(data.bills)) return;
  const dates=billDatesForPeriod(period.label);
  if(!dates.length) return;
  // Add any recurring bills due in this pay period to the Budget section.
  // This is additive only: existing expenses are never removed or overwritten.
  const existingNames=new Set(period.items.filter(x=>x[3]==="bills").map(x=>String(x[0])));
  dates.forEach(({date,day})=>{
    data.bills.forEach((b,bi)=>{
      if(Number(b[2])!==day) return;
      // A pay period normally contains each bill at most once. If an older
      // version already inserted it without a key, recognize it by name.
      if(existingNames.has(String(b[0]))) return;
      const key=bi+"@"+date.getFullYear()+"-"+(date.getMonth()+1)+"-"+day;
      period.items.push([b[0],Number(b[1]||0),"","bills",key]);
      existingNames.add(String(b[0]));
    });
  });
}

function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function render(){
  const p=data.periods[pi];
  ensureBillsForPeriod(p);
  // Planned is based on the actual expense rows in THIS pay period,
  // including recurring bills. This means changing a bill's Planned value
  // immediately changes the Planned total and the Remaining surplus.
  const planned=p.items.reduce((s,x)=>s+Number(x[1]||0),0);
  const actual=p.items.reduce((s,x)=>s+Number(x[2]||0),0);
  const totalIncome=(p.incomeItems||[]).reduce((s,x)=>s+Number(x.amount||0),0);
  p.income=totalIncome;
  $("subtitle").textContent="Budget • "+p.label;
  $("periodname").textContent=p.label;
  $("income").textContent=money(totalIncome);
  $("planned").textContent=money(planned);
  $("actual").textContent=money(actual);
  const surplus=totalIncome-planned;
  $("remaining").textContent=money(surplus);
  $("remaining").className=surplus>0.004?"good":(surplus<-0.004?"bad":"neutral");
  const groups=[
    ["gray","Fixed / Gray"],
    ["yellow","Zack’s Expenses"],
    ["pink","Nicole’s Expenses"],
    ["blue","Miscellaneous"],
    ["bills","Bills"],
    ["unexpected","Unexpected Expenses"]
  ];
  $("incomerows").innerHTML=(p.incomeItems||[]).map((x,i)=>`<div class="income-row"><div class="income-info"><div class="incomename">${escapeHtml(x.name)}</div></div><div class="incomeamount">${money(x.amount)}</div><button class="tiny" onclick="editIncome(${i})">Edit</button></div>`).join("") || '<div class="income-row"><div class="income-info" style="color:var(--muted)">No income added yet.</div></div>';
  let out="";
  groups.forEach(g=>{
    const arr=p.items.map((x,i)=>[x,i]).filter(a=>a[0][3]===g[0]);
    if(!arr.length)return;
    out+=`<div class="cols section ${g[0]}"><div class="cell">${g[1]}</div></div>`;
    arr.forEach(([x,i])=>{
      const d=Number(x[1]||0)-Number(x[2]||0);
      out+=`<div class="cols">
        <div class="cell"><button class="rowedit" onclick="editExpense(${i})">✎ ${x[0]}</button></div>
        <div class="cell"><input class="money" inputmode="decimal" value="${x[1]??''}" onchange="setItem(${i},1,this.value)"></div>
        <div class="cell"><input class="money" inputmode="decimal" placeholder="—" value="${x[2]??''}" onchange="setItem(${i},2,this.value)"></div>
        <div class="cell diff ${d>=0?'good':'bad'}">${Math.abs(d)<.005?'—':(d>0?'+':'')+money(d)}</div>
      </div>`;
    });
  });
  out+=`<div class="cols total"><div class="cell">TOTAL</div><div class="cell">${money(planned)}</div><div class="cell">${money(actual)}</div><div class="cell">${money(planned-actual)}</div></div>`;
  $("rows").innerHTML=out;
  const periodBillDays=new Set(billDatesForPeriod(p.label).map(x=>x.day));
  const visibleBills=data.bills.map((b,i)=>[b,i]).filter(([b])=>periodBillDays.has(Number(b[2]))).sort((a,b)=>Number(a[0][2]||0)-Number(b[0][2]||0));
  $("billrows").innerHTML=visibleBills.map(([b,i])=>`<div class="bill"><div class="billinfo"><div class="billname">${b[0]}</div><div class="billdue">Due ${b[2]}${ord(b[2])}</div></div><div class="billamount">${money(b[1])}</div><button class="tiny" onclick="editBill(${i})">Edit</button></div>`).join("") || '<div class="bill"><div class="billinfo"><div class="billname" style="color:var(--muted)">No recurring bills due in this pay period.</div></div></div>';
  save();
}

function ord(n){return n%10===1&&n%100!==11?"st":n%10===2&&n%100!==12?"nd":n%10===3&&n%100!==13?"rd":"th"}
function setItem(i,k,v){data.periods[pi].items[i][k]=v===""?"":Number(v);save();render()}
function move(n){pi=Math.max(0,Math.min(data.periods.length-1,pi+n));render()}
function incomeEdit(){addIncome()}
function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function addIncome(){
  modalMode="income";edit=-1;
  $("mtitle").textContent="Add Income";
  $("form").innerHTML=`<div class="field"><label>Income source</label><input id="n" placeholder="Work, overtime, reimbursement, etc."></div><div class="field"><label>Amount</label><input id="a" inputmode="decimal" placeholder="0.00"></div>`;
  $("modal").classList.add("open")
}
function editIncome(i){
  modalMode="income";edit=i;const x=data.periods[pi].incomeItems[i];
  $("mtitle").textContent="Edit Income";
  $("form").innerHTML=`<div class="field"><label>Income source</label><input id="n" value="${escapeHtml(x.name)}"></div><div class="field"><label>Amount</label><input id="a" inputmode="decimal" value="${x.amount??0}"></div><button class="deletebtn" type="button" onclick="deleteIncome(${i})">Delete Income</button>`;
  $("modal").classList.add("open")
}
function deleteIncome(i){if(!confirm("Delete this income?"))return;data.periods[pi].incomeItems.splice(i,1);data.periods[pi].income=data.periods[pi].incomeItems.reduce((s,x)=>s+Number(x.amount||0),0);save();closeModal();render()}


function deletePeriod(){
  if(data.periods.length<=1){
    alert("You need to keep at least one pay period.");
    return;
  }
  const label=data.periods[pi].label;
  if(!confirm('Delete pay period "'+label+'"? This will only delete this pay period. Your other pay periods and recurring bills will stay.')) return;
  data.periods.splice(pi,1);
  pi=Math.max(0,Math.min(pi,data.periods.length-1));
  save();
  render();
}

function newPeriod(){
  const l=prompt("Pay period (example: 10/9 – 10/23)");
  if(!l)return;
  const previous=data.periods[pi];
  const items=templateItemsFrom(previous);
  // Income is intentionally NOT carried forward. Add income separately for each period.
  const next={label:l,income:0,incomeItems:[],items};
  data.periods.push(next);
  pi=data.periods.length-1;
  ensureBillsForPeriod(next);
  save();
  render();
}

function editExpense(i){
  modalMode="expense";edit=i;
  const x=data.periods[pi].items[i];
  $("mtitle").textContent="Edit Expense";
  $("form").innerHTML=`<div class="field"><label>Name</label><input id="n" value="${String(x[0]).replaceAll('"','&quot;')}"></div><div class="field"><label>Planned</label><input id="a" inputmode="decimal" value="${x[1]??''}"></div><div class="field"><label>Actual</label><input id="b" inputmode="decimal" value="${x[2]??''}"></div><div class="field"><label>Section</label><select id="c"><option value="gray" ${x[3]==='gray'?'selected':''}>Gray / Fixed</option><option value="yellow" ${x[3]==='yellow'?'selected':''}>Zack’s Expenses</option><option value="pink" ${x[3]==='pink'?'selected':''}>Nicole’s Expenses</option><option value="blue" ${x[3]==='blue'?'selected':''}>Miscellaneous</option><option value="bills" ${x[3]==='bills'?'selected':''}>Bills</option><option value="unexpected" ${x[3]==='unexpected'?'selected':''}>Unexpected Expenses</option></select></div><button class="deletebtn" type="button" onclick="deleteExpense(${i})">Delete Expense</button>`;
  $("modal").classList.add("open")
}
function deleteExpense(i){if(!confirm("Delete this expense?"))return;data.periods[pi].items.splice(i,1);save();closeModal();render()}
function addExpense(){
  modalMode="expense";edit=-1;
  $("mtitle").textContent="Add Expense";
  $("form").innerHTML=`<div class="field"><label>Name</label><input id="n" placeholder="Groceries"></div><div class="field"><label>Planned</label><input id="a" inputmode="decimal" placeholder="0.00"></div><div class="field"><label>Actual</label><input id="b" inputmode="decimal" placeholder="0.00"></div><div class="field"><label>Section</label><select id="c"><option value="gray">Gray / Fixed</option><option value="yellow">Zack’s Expenses</option><option value="pink">Nicole’s Expenses</option><option value="blue">Miscellaneous</option><option value="bills">Bills</option><option value="unexpected">Unexpected Expenses</option></select></div>`;
  $("modal").classList.add("open")
}
function addBill(){modalMode="bill";edit=-1;$("mtitle").textContent="Add Recurring Bill";$("form").innerHTML=`<div class="field"><label>Bill</label><input id="n" placeholder="Electric"></div><div class="field"><label>Amount</label><input id="a" inputmode="decimal" placeholder="0.00"></div><div class="field"><label>Due day</label><input id="c" inputmode="numeric" placeholder="15"></div>`;$("modal").classList.add("open")}
function editBill(i){modalMode="bill";edit=i;let b=data.bills[i];$("mtitle").textContent="Edit Recurring Bill";$("form").innerHTML=`<div class="field"><label>Bill</label><input id="n" value="${b[0]}"></div><div class="field"><label>Amount</label><input id="a" inputmode="decimal" value="${b[1]}"></div><div class="field"><label>Due day</label><input id="c" inputmode="numeric" value="${b[2]}"></div>`;$("modal").classList.add("open")}
function saveModal(){
  let n=$("n").value.trim(),a=Number($("a").value)||0;
  if(!n)return;
  if(modalMode==="expense"){
    let item=[n,a,$("b").value===""?"":Number($("b").value),$("c").value];
    if(edit<0)data.periods[pi].items.push(item);else data.periods[pi].items[edit]=item;
  }else if(modalMode==="income"){
    const item={id:edit<0?"income-"+Date.now():data.periods[pi].incomeItems[edit].id,name:n,amount:a};
    if(edit<0)data.periods[pi].incomeItems.push(item);else data.periods[pi].incomeItems[edit]=item;
    data.periods[pi].income=data.periods[pi].incomeItems.reduce((s,x)=>s+Number(x.amount||0),0);
  }else{
    let d=Math.min(31,Math.max(1,Number($("c").value)||1));
    if(edit<0)data.bills.push([n,a,d]);else data.bills[edit]=[n,a,d];
  }
  save();closeModal();render();
}
function closeModal(){$("modal").classList.remove("open")}
render();</script>
</body></html>
